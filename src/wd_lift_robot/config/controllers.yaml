controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    # Controller definitions
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    
    # Wheel joint names must match your URDF
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    
    # Physical properties from URDF
    wheel_separation: 0.70
    wheel_radius: 0.1
    
    # Odometry settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true # Publish the odom -> base_link transform

    # Set to false for real robot, true for simulation if position feedback is perfect
    open_loop: false

    # Covariance for odometry. Adjust if odometry is inaccurate.
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    cmd_vel_timeout: 0.5 # Seconds
    
    # Hardware limits - Tuned for better navigation performance
    # These should be the absolute max for your robot hardware.
    # Nav2's local planner will use lower limits for safe navigation.
    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 0.5      # Reduced from 1.0 for better control
        max_acceleration: 1.5  # Reduced from 1.0, more realistic
        min_acceleration: -1.5 # Reduced from -1.0
    
    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 1.0      # Kept at 1.0, a reasonable max
        max_acceleration: 2.0  # Reduced from 1.0
        min_acceleration: -2.0 # Reduced from -1.0

lift_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolation_method: splines

# FIXED: This section was missing its configuration.
# It's required for RViz to show wheel rotations and for robot_state_publisher to work correctly.
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # List all joints whose states should be published to /joint_states
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - lift_joint